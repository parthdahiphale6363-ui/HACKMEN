[pytest]
addopts = -s
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    network: marks tests that make live outbound external network/API calls
    slow: marks tests that execute extensive simulations or multi-round benchmarks
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
