[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truthlens-ai"
version = "1.0.0"
description = "Multimodal Video Forensics & Fact-Checking Engine for Short-Form Media"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TruthLens AI Engineering Team", email = "engineering@truthlens.ai" }
]
keywords = [
    "deepfake-detection",
    "video-forensics",
    "fact-checking",
    "osint",
    "multimodal-ai",
    "misinformation",
    "c2pa",
    "audio-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "C90", "I", "N", "B", "A", "C4", "T20", "PT", "RET", "SIM", "ARG"]
ignore = ["E501", "B008", "C901", "SIM105"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG", "PT", "T201"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::starlette.testclient.StarletteDeprecationWarning"
]

[tool.coverage.run]
source = ["backend", "pipeline", "shared"]
omit = ["tests/*", "venv/*", "frontend/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass"
]
show_missing = true
